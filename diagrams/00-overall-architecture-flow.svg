<svg viewBox="0 0 1000 1200" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="1500" fill="#ffffff"/>
  <text x="500" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#1e293b">AI Ticket Automation Platform — Overall Architecture</text>

  <!-- 1. Customer submits ticket -->
  <rect x="380" y="66" width="240" height="52" rx="8" fill="#1f2937"/>
  <text x="500" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Customer submits ticket</text>

  <line x1="500" y1="118" x2="500" y2="150" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Express API -->
  <rect x="330" y="150" width="340" height="58" rx="8" fill="#0f766e"/>
  <text x="500" y="174" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Express API — controllers/ticket.js</text>
  <text x="500" y="194" text-anchor="middle" font-size="12" fill="#e2f4f1">saves ticket, returns immediately</text>

  <!-- branch: immediate 201 response -->
  <line x1="670" y1="179" x2="760" y2="179" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>
  <rect x="760" y="150" width="180" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="850" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#334155">201 Created</text>
  <text x="850" y="192" text-anchor="middle" font-size="11" fill="#475569">sent back to customer</text>
  <text x="850" y="207" text-anchor="middle" font-size="11" fill="#475569">(&lt; milliseconds)</text>

  <line x1="500" y1="208" x2="500" y2="240" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Inngest event ticket/created -->
  <rect x="340" y="240" width="320" height="50" rx="8" fill="#7c3aed"/>
  <text x="500" y="271" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Inngest event: "ticket/created"</text>

  <line x1="500" y1="290" x2="500" y2="322" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 4. Background pipeline container -->
  <rect x="150" y="322" width="700" height="330" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 150 322 h 300 v 26 l -12 10 h -288 z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="164" y="342" font-size="13" font-weight="bold" fill="#1e293b">Background pipeline (on-ticket-create.js)</text>

  <!-- step boxes inside -->
  <g font-size="12.5" fill="#1e293b">
    <rect x="180" y="368" width="640" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="200" y="394">1. Classify — zero-shot NLI + fine-tuned RoBERTa priority model</text>

    <rect x="180" y="418" width="640" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="200" y="444">2. Search Qdrant for similar past resolutions</text>

    <rect x="180" y="468" width="640" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="200" y="494">3. Tier decision: duplicate / augmented / cold</text>

    <rect x="180" y="518" width="640" height="42" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="200" y="544">4. Conditionally call local LLM (Ollama)</text>

    <rect x="180" y="568" width="640" height="60" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="200" y="592">5. Save results, email customer, assign moderator,</text>
    <text x="200" y="610">   notify moderator/admin</text>
  </g>
  <line x1="500" y1="410" x2="500" y2="418" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="500" y1="460" x2="500" y2="468" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="500" y1="510" x2="500" y2="518" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="500" y1="560" x2="500" y2="568" stroke="#cbd5e1" stroke-width="1.5"/>

  <line x1="500" y1="652" x2="500" y2="684" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. Moderator resolves ticket -->
  <rect x="300" y="684" width="400" height="54" rx="8" fill="#1f2937"/>
  <text x="500" y="716" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Moderator resolves ticket</text>

  <line x1="500" y1="738" x2="500" y2="770" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 6. Inngest event ticket/resolved -->
  <rect x="340" y="770" width="320" height="50" rx="8" fill="#7c3aed"/>
  <text x="500" y="801" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#ffffff">Inngest event: "ticket/resolved"</text>

  <line x1="500" y1="820" x2="500" y2="852" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 7. storeResolvedTicket -->
  <rect x="270" y="852" width="460" height="66" rx="8" fill="#0369a1"/>
  <text x="500" y="878" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">storeResolvedTicket()</text>
  <text x="500" y="897" text-anchor="middle" font-size="11.5" fill="#dbeafe">embeds problem text, upserts resolution into Qdrant</text>

  <line x1="500" y1="918" x2="500" y2="950" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 8. Available for retrieval -->
  <rect x="240" y="950" width="520" height="54" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.3"/>
  <text x="500" y="976" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#78350f">Available for retrieval on the NEXT similar ticket</text>
  <text x="500" y="994" text-anchor="middle" font-size="11" fill="#92400e">(feeds back into step 2 of the background pipeline above)</text>

  <!-- feedback loop arrow, curving back up to step 2 -->
  <path d="M 240 977 C 60 977, 60 442, 180 442" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowGray)"/>

  <!-- Nightly cron branch -->
  <rect x="760" y="955" width="220" height="108" rx="8" fill="#fff7ed" stroke="#fb923c" stroke-width="1.3"/>
  <text x="870" y="978" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c2d12">Nightly cron</text>
  <text x="870" y="994" text-anchor="middle" font-size="10.5" fill="#7c2d12">sync-resolved-tickets.js</text>
  <text x="870" y="1013" text-anchor="middle" font-size="10.5" fill="#7c2d12">backfills any resolved ticket</text>
  <text x="870" y="1028" text-anchor="middle" font-size="10.5" fill="#7c2d12">that failed to reach Qdrant</text>
  <text x="870" y="1043" text-anchor="middle" font-size="10.5" fill="#7c2d12">in real time</text>

  <path d="M 870 955 C 870 900, 731 890, 730 878" fill="none" stroke="#fb923c" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowGray)"/>

  <!-- Legend -->
  <g font-size="11" fill="#475569">
    <rect x="150" y="1080" width="14" height="14" fill="#0f766e"/>
    <text x="172" y="1091">Synchronous API layer</text>

    <rect x="330" y="1080" width="14" height="14" fill="#7c3aed"/>
    <text x="352" y="1091">Event (Inngest)</text>

    <rect x="470" y="1080" width="14" height="14" fill="#0369a1"/>
    <text x="492" y="1091">Vector store write</text>

    <rect x="620" y="1080" width="14" height="14" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="642" y="1091">Knowledge base state</text>

    <line x1="150" y1="1112" x2="180" y2="1112" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="188" y="1116">reconciliation / feedback loop (not a live request path)</text>
  </g>
</svg>
